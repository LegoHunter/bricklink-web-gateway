apiVersion: apps/v1
kind: Deployment
metadata:
  name: bricklink-web-gateway
  labels:
    app: bricklink-web-gateway
spec:
  # Exactly one pod, ever: two browsers must never share the profile. Recreate stops the old pod
  # before the new one starts, which the ReadWriteOnce volume also requires.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bricklink-web-gateway
  template:
    metadata:
      name: bricklink-web-gateway
      labels:
        app: bricklink-web-gateway   # selector label (required)
        app.kubernetes.io/name: bricklink-web-gateway
        app.kubernetes.io/version: "0.0.1"
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: lego-platform
    spec:
      # Never run as root; default seccomp filter; volumes group-owned by the app user.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Room for the 10s preStop pause plus Spring Boot's graceful shutdown, which also closes the
      # browser cleanly so Chromium writes its cookie jar to the volume.
      terminationGracePeriodSeconds: 60
      containers:
        - name: bricklink-web-gateway
          image: quay.io/tvattima/bricklink-web-gateway
          # No privilege escalation, no Linux capabilities, read-only image filesystem. The writable
          # paths are /tmp and the browser profile volume.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 5

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10

          env:
            # A small heap: the JVM only coordinates. Chromium, a separate process, is the memory
            # cost and is not covered by -Xmx; the container limit in the overlay covers both.
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -Xms128m
                -Xmx256m
                -XX:+UseSerialGC
                -XX:+UseContainerSupport
          volumeMounts:
            # Credentials for the environment (secretName set by each overlay). Must stay first:
            # the overlays patch volumes/0.
            - name: external-secret
              mountPath: /etc/.credentials
              readOnly: true
            # Must stay after the secret: the overlays patch volumes/0.
            - name: tmp
              mountPath: /tmp
            # The browser profile: the signed-in session. Survives pod restarts and reschedules.
            - name: browser-profile
              mountPath: /var/lib/bricklink-web-gateway
      volumes:
        - name: external-secret
          secret:
            # Placeholder: every overlay replaces it with services-<env>-external-secret.
            secretName: set-by-overlay
        # java.io.tmpdir and HOME: Tomcat work files, the unpacked Playwright driver, Chromium's
        # caches and its shared-memory files (--disable-dev-shm-usage).
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        # Created once per namespace by an administrator (kubernetes/cluster-setup), not by the
        # deploy pipeline: it holds the live session and must outlive every deploy.
        - name: browser-profile
          persistentVolumeClaim:
            claimName: bricklink-web-gateway-profile
      restartPolicy: Always
