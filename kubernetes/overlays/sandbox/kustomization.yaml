apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace for this overlay
namespace: services-sandbox

labels:
  - pairs:
      app.kubernetes.io/instance: sandbox
    # Also on the pod template: the base carries no environment.
    includeTemplates: true

# Base resources (environment-neutral; the patches below set the environment's values)
resources:
  - ../../base

# Image tag injection
images:
  - name: quay.io/tvattima/bricklink-web-gateway
    newTag: snapshot

# Never more than one: two browsers must not share the profile.
replicas:
  - name: bricklink-web-gateway
    count: 1

patches:
  - path: deployment-env-patch.yaml
  - path: deployment-resources-patch.yaml
  # services-sandbox-external-secret mount
  - path: deployment-sandbox-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: bricklink-web-gateway
  # Hostname and TLS certificate
  - path: ingress-patch.yaml
    target:
      group: traefik.io
      version: v1alpha1
      kind: IngressRoute
      name: bricklink-web-gateway
