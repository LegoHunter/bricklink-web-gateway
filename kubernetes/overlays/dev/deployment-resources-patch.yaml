apiVersion: apps/v1
kind: Deployment
metadata:
  name: bricklink-web-gateway
spec:
  template:
    spec:
      containers:
        - name: bricklink-web-gateway
          # A starting point, not a measurement: the JVM (256 MB heap) plus Chromium while it is open.
          # Measure on a node and adjust.
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1536Mi"
              cpu: "2"
