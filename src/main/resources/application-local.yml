# A developer PC. There is no bundled Chromium outside the container image, so use installed Chrome.
spring:
  config:
    import:
      - optional:file:/dev/config/bricklink-client-api-keys.yml

bricklink:
  web-gateway:
    browser-channel: chrome
    profile-dir: ${BRICKLINK_GATEWAY_PROFILE_DIR:${user.home}/.bricklink-web-gateway/profile}
    admin-token: ${BRICKLINK_GATEWAY_ADMIN_TOKEN:}
    caller-token: ${BRICKLINK_GATEWAY_CALLER_TOKEN:}
